[tools]
"github:crate-ci/cargo-release" = "1.1.2"
"github:mitsuhiko/insta" = "1.47.2"
dasel = "3.11"
node = "26"
"github:pnpm/pnpm" = "11"
deno = "2"
bun = "1"
"aqua:nushell/nushell" = "0.113.0"
"pipx:fonttools" = { version = "4.63.0", extras = "woff" }

[tools.rust]
version = "1.95.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"
targets = "wasm32-unknown-unknown"

[tools."github:rustwasm/wasm-pack"]
version = "0.15.0"

[tools."github:rustwasm/wasm-pack".platforms]
linux-x64 = "wasm-pack-v*-x86_64-unknown-linux-musl.tar.gz"
linux-arm64 = "wasm-pack-v*-aarch64-unknown-linux-musl.tar.gz"
macos-x64 = "wasm-pack-v*-x86_64-apple-darwin.tar.gz"
macos-arm64 = "wasm-pack-v*-aarch64-apple-darwin.tar.gz"
windows-x64 = "wasm-pack-v*-x86_64-pc-windows-msvc.tar.gz"

[tools."github:dahlia/hongdown"]
version = "0.4.1"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"


[tasks.check]
description = "Run fast checks suitable for pre-commit"
depends = [
  "fmt-check",
  "typecheck",
  "clippy",
  "js-typecheck",
  "js-lint",
  "js-doc",
  "js-fmt-check",
]

[tasks.ci]
description = "Run the full CI verification gate"
depends = ["check", "test", "doc", "js-build", "js-test"]

[tasks.bump]
description = "Preview a workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push"

[tasks.bump-execute]
description = "Commit a signed workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push --execute"

[tasks.typecheck]
description = "Check all Rust workspace targets"
run = "cargo check --workspace --all-targets"

[tasks.clippy]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets"

[tasks.fmt]
description = "Format code and docs"
run = ["cargo fmt --all", "hongdown --write", "mise fmt", "deno fmt packages/"]

[tasks.fmt-check]
description = "Check code, docs, and mise formatting"
run = ["cargo fmt --all --check", "hongdown --check", "mise fmt --check"]

[tasks.test]
description = "Run Rust workspace tests"
run = "cargo test --workspace"

[tasks.doc]
description = "Build Rust API documentation with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.js-install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install"

[tasks.js-typecheck]
description = "Type-check TypeScript packages with Deno"
run = [
  "deno check packages/types/index.ts",
  "deno check packages/wasm/index.ts",
  "deno check packages/stdict-fst/index.ts",
  "deno check packages/stdict-cdb/index.ts",
  "deno check tests/js/wasm.test.ts",
  "deno check tests/js/napi.test.ts",
]

[tasks.js-lint]
description = "Lint TypeScript packages with Deno"
run = "deno lint"

[tasks.js-doc]
description = "Verify JSDoc completeness for TypeScript packages"
run = [
  "deno doc --lint ./packages/types/index.ts",
  "deno doc --lint ./packages/wasm/index.ts",
  "deno doc --lint ./packages/stdict-fst/index.ts",
  "deno doc --lint ./packages/stdict-cdb/index.ts",
]

[tasks.js-fmt]
description = "Format TypeScript packages with Deno"
run = "deno fmt"

[tasks.js-fmt-check]
description = "Check TypeScript package formatting with Deno"
run = "deno fmt --check"

[tasks.wasm-build]
description = "Build gukhanmun-wasm WASM module for web, nodejs, and deno targets"
shell = "nu -c"
run = """
let out = $"(pwd)/packages/wasm/wasm"
wasm-pack build crates/gukhanmun-wasm --release --target web --out-dir $"($out)/web"
wasm-pack build crates/gukhanmun-wasm --release --target nodejs --out-dir $"($out)/nodejs"
wasm-pack build crates/gukhanmun-wasm --release --target deno --out-dir $"($out)/deno"
"""

[tasks.stdict-fst-data]
description = "Build gukhanmun-stdict (release) and copy FST binary to packages/stdict-fst/"
shell = "nu -c"
run = """
cargo build -p gukhanmun-stdict --release
let matches = (
  glob "target/release/build/**/out/stdict.gukfst"
  | where { |p| $p | str contains "gukhanmun-stdict" }
)
if ($matches | is-empty) {
  error make { msg: "stdict.gukfst not found after release build" }
}
cp ($matches | first) packages/stdict-fst/stdict.fst
"""

[tasks.napi-build]
description = "Build the gukhanmun-napi native Node.js addon"
shell = "nu -c"
run = """
cargo build -p gukhanmun-napi --release
match $nu.os-info.name {
  "macos" => { cp target/release/libgukhanmun_napi.dylib packages/napi/gukhanmun_napi.node }
  "windows" => { cp target/release/gukhanmun_napi.dll packages/napi/gukhanmun_napi.node }
  _ => { cp target/release/libgukhanmun_napi.so packages/napi/gukhanmun_napi.node }
}
"""

[tasks.stdict-cdb-data]
description = "Build gukhanmun-mkdict (release) and generate CDB binary to packages/stdict-cdb/"
shell = "nu -c"
run = """
let manifest_dir = $"(pwd)/crates/gukhanmun-stdict"
cargo run --release -p gukhanmun-mkdict -- --format cdb --output packages/stdict-cdb/stdict.cdb --rules $"($manifest_dir)/data/rules.tsv" $"($manifest_dir)/data/stdict.tsv"
"""

[tasks.js-build]
description = "Build npm packages with tsdown (TypeScript wrappers)"
depends = ["wasm-build", "stdict-fst-data", "stdict-cdb-data", "js-install"]
run = "pnpm -r run build"

[tasks.js-test]
description = "Run JavaScript integration tests on Node.js, Deno, and Bun"
depends = [
  "wasm-build",
  "stdict-fst-data",
  "stdict-cdb-data",
  "napi-build",
  "js-install",
]
# Both bindings run on all three runtimes.  The wasm binding loads its module
# and dictionary files via fetch(file://) (Deno/Bun) or node:fs (Node); the
# napi native addon needs Deno's --allow-ffi/--allow-env/--allow-sys on top of
# --allow-read.
run = [
  "node --test tests/js/wasm.test.ts tests/js/napi.test.ts",
  "deno test --allow-read --allow-env --allow-ffi --allow-sys tests/js/wasm.test.ts tests/js/napi.test.ts",
  "bun test tests/js/wasm.test.ts tests/js/napi.test.ts",
]

[tasks.js-sync-version]
description = "Write a version string to all JS package manifests"
shell = "nu -c"
run = """
let ver = if "VERSION" in $env { $env.VERSION } else {
  error make { msg: "usage: VERSION=x.y.z mise run js-sync-version" }
}

def update_json [file: string] {
  let updated = open $file | upsert version $ver | to json --indent 2
  ($updated + "\n") | save --force $file
}

for pkg in [
  packages/types packages/wasm packages/napi
  packages/napi-aarch64-apple-darwin packages/napi-x86_64-apple-darwin
  packages/napi-aarch64-pc-windows-msvc packages/napi-x86_64-pc-windows-msvc
  packages/napi-aarch64-unknown-linux-gnu packages/napi-x86_64-unknown-linux-gnu
  packages/stdict-fst packages/stdict-cdb
] {
  update_json $"($pkg)/package.json"
}
for pkg in [packages/types packages/wasm packages/stdict-fst packages/stdict-cdb] {
  update_json $"($pkg)/deno.json"
}
"""

[tasks.js-version-dev]
description = "Compute a dev pre-release version and sync it to all JS manifests"
shell = "nu -c"
run = """
let build = if "BUILD" in $env { $env.BUILD } else { "0" }
let commit = (git rev-parse --short HEAD | str trim)
let base = (open Cargo.toml | get workspace.package.version)
let ver = $"($base)-dev.($build)+($commit)"
print $"Syncing JS manifests to version: ($ver)"
$env.VERSION = $ver
mise run js-sync-version
"""

[tasks.js-publish]
description = "Publish npm and JSR packages locally (manual first-publish or recovery)"
shell = "nu -c"
run = """
pnpm -r publish --no-git-checks
deno publish --allow-dirty
"""

[tasks.wasm-check]
description = "Verify gukhanmun compiles for wasm32-unknown-unknown (html+fst features)"
run = "cargo check -p gukhanmun --no-default-features --features 'html,fst' --target wasm32-unknown-unknown"

[tasks.generate-unihan]
description = "Regenerate Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan --"

[tasks.generate-unihan-check]
description = "Check generated Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan -- --check"

[tasks.gukhanmun]
description = "Run the gukhanmun plain-text CLI"
# Run in the directory mise was invoked from (default is the project root), so
# relative path arguments resolve against the user's current directory.  cargo
# still finds the workspace by walking up to its Cargo.toml.
dir = "{{cwd}}"
run = "cargo run -p gukhanmun-cli --"

[tasks.insta-review]
description = "Interactively review and accept/reject pending insta snapshots"
run = "cargo insta review"

# The ko-KR locale is generated by the docs package's own prebuild/predev
# scripts (docs/package.json `gen:ko-kr`), so `pnpm build` / `pnpm dev` fill it
# too. This task is a manual "regenerate ko-KR only" convenience.
[tasks.docs-ko-kr]
description = "Generate the hangul-only (ko-KR) docs locale from ko-Kore via the gukhanmun CLI"
run = "pnpm --filter @gukhanmun/docs run gen:ko-kr"

[tasks.docs-dev]
description = "Start the Rspress documentation dev server"
depends = ["wasm-build", "stdict-fst-data", "stdict-cdb-data", "js-install"]
run = [
  "pnpm --filter @gukhanmun/types --filter @gukhanmun/wasm --filter @gukhanmun/stdict-fst --filter @gukhanmun/stdict-cdb --filter @gukhanmun/napi run build",
  "pnpm --filter @gukhanmun/docs run dev",
]

[tasks.docs-build]
description = "Build the Rspress documentation site for production"
depends = ["wasm-build", "stdict-fst-data", "stdict-cdb-data", "js-install"]
run = "pnpm --filter @gukhanmun/docs run build"

[tasks.docs-fonts]
description = "Subset Noto Sans/Serif KR to the glyphs used by the docs hero animation"
run = "node docs/scripts/subset-hero-fonts.mjs"
