[tools]
"github:crate-ci/cargo-release" = "1.1.2"
"github:mitsuhiko/insta" = "1.47.2"
dasel = "3.11"

[tools.rust]
version = "1.95.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"

[tools."github:dahlia/hongdown"]
version = "0.3.11"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"


[tasks.check]
description = "Run fast checks suitable for pre-commit"
depends = ["fmt-check", "typecheck", "clippy"]

[tasks.ci]
description = "Run the full CI verification gate"
depends = ["check", "test", "doc"]

[tasks.bump]
description = "Preview a workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push"

[tasks.bump-execute]
description = "Commit a signed workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push --execute"

[tasks.typecheck]
description = "Check all Rust workspace targets"
run = "cargo check --workspace --all-targets"

[tasks.clippy]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets"

[tasks.fmt]
description = "Format code and docs"
run = ["cargo fmt --all", "hongdown --write", "mise fmt"]

[tasks.fmt-check]
description = "Check code, docs, and mise formatting"
run = ["cargo fmt --all --check", "hongdown --check", "mise fmt --check"]

[tasks.test]
description = "Run Rust workspace tests"
run = "cargo test --workspace"

[tasks.doc]
description = "Build Rust API documentation with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.generate-unihan]
description = "Regenerate Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan --"

[tasks.generate-unihan-check]
description = "Check generated Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan -- --check"

[tasks.gukhanmun]
description = "Run the gukhanmun plain-text CLI"
run = "cargo run -p gukhanmun-cli --"

[tasks.insta-review]
description = "Interactively review and accept/reject pending insta snapshots"
run = "cargo insta review"
