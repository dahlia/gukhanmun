[tools]
"github:crate-ci/cargo-release" = "1.1.2"
"github:mitsuhiko/insta" = "1.47.2"
dasel = "3.11"
node = "26"
"github:pnpm/pnpm" = "11"
deno = "2"
bun = "1"

[tools.rust]
version = "1.95.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"
targets = "wasm32-unknown-unknown"

[tools."github:rustwasm/wasm-pack"]
version = "0.13.1"

[tools."github:rustwasm/wasm-pack".platforms]
linux-x64 = "wasm-pack-v*-x86_64-unknown-linux-musl.tar.gz"
linux-arm64 = "wasm-pack-v*-aarch64-unknown-linux-musl.tar.gz"
macos-x64 = "wasm-pack-v*-x86_64-apple-darwin.tar.gz"
macos-arm64 = "wasm-pack-v*-aarch64-apple-darwin.tar.gz"
windows-x64 = "wasm-pack-v*-x86_64-pc-windows-msvc.zip"

[tools."github:dahlia/hongdown"]
version = "0.3.11"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"


[tasks.check]
description = "Run fast checks suitable for pre-commit"
depends = [
  "fmt-check",
  "typecheck",
  "clippy",
  "js-typecheck",
  "js-lint",
  "js-doc",
  "js-fmt-check",
]

[tasks.ci]
description = "Run the full CI verification gate"
depends = ["check", "test", "doc", "js-build", "js-test"]

[tasks.bump]
description = "Preview a workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push"

[tasks.bump-execute]
description = "Commit a signed workspace version bump"
run = "cargo release --workspace --no-publish --no-tag --no-push --execute"

[tasks.typecheck]
description = "Check all Rust workspace targets"
run = "cargo check --workspace --all-targets"

[tasks.clippy]
description = "Lint all Rust workspace targets"
run = "cargo clippy --workspace --all-targets"

[tasks.fmt]
description = "Format code and docs"
run = ["cargo fmt --all", "hongdown --write", "mise fmt", "deno fmt packages/"]

[tasks.fmt-check]
description = "Check code, docs, and mise formatting"
run = ["cargo fmt --all --check", "hongdown --check", "mise fmt --check"]

[tasks.test]
description = "Run Rust workspace tests"
run = "cargo test --workspace"

[tasks.doc]
description = "Build Rust API documentation with warnings denied"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.js-install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install"

[tasks.js-typecheck]
description = "Type-check TypeScript packages with Deno"
run = [
  "deno check packages/types/index.ts",
  "deno check packages/wasm/index.ts",
  "deno check packages/stdict-fst/index.ts",
  "deno check tests/js/wasm.test.ts",
]

[tasks.js-lint]
description = "Lint TypeScript packages with Deno"
run = "deno lint"

[tasks.js-doc]
description = "Verify JSDoc completeness for TypeScript packages"
run = [
  "deno doc --lint ./packages/types/index.ts",
  "deno doc --lint ./packages/wasm/index.ts",
  "deno doc --lint ./packages/stdict-fst/index.ts",
]

[tasks.js-fmt]
description = "Format TypeScript packages with Deno"
run = "deno fmt"

[tasks.js-fmt-check]
description = "Check TypeScript package formatting with Deno"
run = "deno fmt --check"

[tasks.wasm-build]
description = "Build gukhanmun-wasm WASM module for web, nodejs, and deno targets"
run = """
set -e
OUT=$(pwd)/packages/wasm/wasm
wasm-pack build crates/gukhanmun-wasm --release --target web --out-dir "$OUT/web"
wasm-pack build crates/gukhanmun-wasm --release --target nodejs --out-dir "$OUT/nodejs"
wasm-pack build crates/gukhanmun-wasm --release --target deno --out-dir "$OUT/deno"
"""

[tasks.stdict-fst-data]
description = "Build gukhanmun-stdict (release) and copy FST binary to packages/stdict-fst/"
run = """
set -e
cargo build -p gukhanmun-stdict --release
FST=$(find target/release/build -name "stdict.gukfst" -path "*/gukhanmun-stdict*/out/*" 2>/dev/null | head -1)
if [ -z "$FST" ]; then
  echo "ERROR: stdict.gukfst not found after release build" >&2
  exit 1
fi
cp "$FST" packages/stdict-fst/stdict.fst
"""

[tasks.napi-build]
description = "Build the gukhanmun-napi native Node.js addon"
run = """
set -e
cargo build -p gukhanmun-napi --release
case "$(uname -s)" in
  Darwin)
    cp target/release/libgukhanmun_napi.dylib packages/napi/gukhanmun_napi.node
    ;;
  MINGW*|CYGWIN*|MSYS*)
    cp target/release/gukhanmun_napi.dll packages/napi/gukhanmun_napi.node
    ;;
  *)
    cp target/release/libgukhanmun_napi.so packages/napi/gukhanmun_napi.node
    ;;
esac
"""

[tasks.js-build]
description = "Build npm packages with tsdown (TypeScript wrappers)"
depends = ["wasm-build", "stdict-fst-data", "js-install"]
run = "pnpm -r run build"

[tasks.js-test]
description = "Run JavaScript tests on Node.js, Deno, and Bun"
depends = ["wasm-build", "stdict-fst-data", "napi-build", "js-install"]
run = [
  "node --test tests/js/wasm.test.ts tests/js/napi.test.ts",
  "deno test --allow-read tests/js/wasm.test.ts",
  "bun test tests/js/wasm.test.ts",
]

[tasks.wasm-check]
description = "Verify gukhanmun compiles for wasm32-unknown-unknown (html+fst features)"
run = "cargo check -p gukhanmun --no-default-features --features 'html,fst' --target wasm32-unknown-unknown"

[tasks.generate-unihan]
description = "Regenerate Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan --"

[tasks.generate-unihan-check]
description = "Check generated Unihan kHangul fallback reading data"
run = "cargo run -p gukhanmun-unihan -- --check"

[tasks.gukhanmun]
description = "Run the gukhanmun plain-text CLI"
run = "cargo run -p gukhanmun-cli --"

[tasks.insta-review]
description = "Interactively review and accept/reject pending insta snapshots"
run = "cargo insta review"
