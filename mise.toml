[tools]
"github:crate-ci/cargo-release" = "1.1.2"
"github:mitsuhiko/insta" = "1.47.2"
"github:rhysd/actionlint" = "1.7.12"
dasel = "3.11"
node = "26"
"github:pnpm/pnpm" = "11"
deno = "2"
bun = "1"
"aqua:nushell/nushell" = "0.113.0"
"pipx:fonttools" = { version = "4.63.0", extras = "woff" }
"github:koalaman/shellcheck" = "0.11.0"

[tools.rust]
version = "1.95.0"
profile = "default"
components = "rust-analyzer,rustfmt,clippy"
targets = "wasm32-unknown-unknown"

[tools."github:rustwasm/wasm-pack"]
version = "0.15.0"

[tools."github:rustwasm/wasm-pack".platforms]
linux-x64 = "wasm-pack-v*-x86_64-unknown-linux-musl.tar.gz"
linux-arm64 = "wasm-pack-v*-aarch64-unknown-linux-musl.tar.gz"
macos-x64 = "wasm-pack-v*-x86_64-apple-darwin.tar.gz"
macos-arm64 = "wasm-pack-v*-aarch64-apple-darwin.tar.gz"
windows-x64 = "wasm-pack-v*-x86_64-pc-windows-msvc.tar.gz"

[tools."github:dahlia/hongdown"]
version = "0.5.0"

[tools."github:dahlia/hongdown".platforms]
linux-x64 = "hongdown-*-x86_64-unknown-linux-musl.tar.bz2"
linux-arm64 = "hongdown-*-aarch64-unknown-linux-musl.tar.bz2"


[tasks.check]
description = "Run fast checks suitable for pre-commit"
depends = [
  "actionlint",
  "fmt-check",
  "typecheck",
  "clippy",
  "js-typecheck",
  "js-lint",
  "js-doc",
  "js-fmt-check",
]

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.ci]
description = "Run the full CI verification gate"
depends = ["check", "test", "doc", "js-build", "js-test"]

[tasks.rust-init]
description = "Materialize the pinned Rust toolchain in a single rustup process"
shell = "nu -c"
# mise's rust tool is a symlink backend that defers to the system rustup, so the
# toolchain and its components are not actually downloaded until the first cargo
# invocation.  Under `mise run ci` several cargo tasks start at once and race to
# populate ~/.rustup/downloads, which intermittently fails with a rename error
# on a partial download (seen on macOS CI).  Every Rust task depends on this one
# so the DAG runs it exactly once, up front, in a single rustup process.  The
# toolchain spec is read straight from [tools.rust] to stay in sync with it.
run = """
let rust = (open mise.toml | get tools.rust)
# rustup wants each component/target as its own flag occurrence, not several
# values after one flag, so expand into [--component x --component y ...].
let comp_args = ($rust.components | split row "," | each { |c| ["--component" $c] } | flatten)
let target_args = ($rust.targets | split row "," | each { |t| ["--target" $t] } | flatten)
(
  rustup toolchain install $rust.version
    --profile $rust.profile
    ...$comp_args
    ...$target_args
    --no-self-update
)
"""

[tasks.bump]
description = "Preview a workspace + JS manifest version bump"
usage = 'arg "<version>" help="Target release version, e.g. 1.2.5"'
shell = "nu -c"
depends = ["rust-init"]
run = "cargo release --workspace --no-publish --no-tag --no-push $env.usage_version"

[tasks.bump-execute]
description = "Create one signed commit bumping the workspace and the packages/ JS manifests"
usage = 'arg "<version>" help="Target release version, e.g. 1.2.5"'
shell = "nu -c"
depends = ["rust-init"]
# cargo-release bumps the shared Cargo version, the intra-workspace dependency
# requirements, and Cargo.lock, then writes a signed commit.  It knows nothing
# about the package.json/deno.json manifests under packages/, so we sync those
# to the same version and fold exactly them into that one signed commit; the
# explicit pathspec keeps any unrelated working-tree change out of the bump.
# The JS version is read back from Cargo.toml after cargo-release runs, so it
# tracks the version actually applied even when <version> is a bump level such
# as "patch" or "minor".  Run this on a clean tree; cargo-release refuses to
# bump when there are uncommitted changes.
run = """
cargo release --workspace --no-publish --no-tag --no-push --execute $env.usage_version
$env.VERSION = (open Cargo.toml | get workspace.package.version)
mise run js-sync-version
git commit -S --amend --no-edit packages/*/package.json packages/*/deno.json
"""

[tasks.typecheck]
description = "Check all Rust workspace targets"
depends = ["rust-init"]
run = "cargo check --workspace --all-targets"

[tasks.clippy]
description = "Lint all Rust workspace targets"
depends = ["rust-init"]
run = "cargo clippy --workspace --all-targets"

[tasks.fmt]
description = "Format code and docs"
depends = ["rust-init"]
run = ["cargo fmt --all", "hongdown --write", "mise fmt", "deno fmt packages/"]

[tasks.fmt-check]
description = "Check code, docs, and mise formatting"
depends = ["rust-init"]
run = ["cargo fmt --all --check", "hongdown --check", "mise fmt --check"]

[tasks.test]
description = "Run Rust workspace tests"
depends = ["rust-init"]
run = "cargo test --workspace"

[tasks.doc]
description = "Build Rust API documentation with warnings denied"
depends = ["rust-init"]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.js-install]
description = "Install JavaScript workspace dependencies"
run = "pnpm install"

[tasks.js-typecheck]
description = "Type-check TypeScript packages with Deno"
run = [
  "deno check packages/types/index.ts",
  "deno check packages/wasm/index.ts",
  "deno check packages/stdict-fst/index.ts",
  "deno check packages/stdict-cdb/index.ts",
  "deno check packages/opendict-fst/index.ts",
  "deno check packages/opendict-cdb/index.ts",
  "deno check tests/js/wasm.test.ts",
  "deno check tests/js/napi.test.ts",
  "deno check tests/js/stdict-loader.test.ts",
  "deno check tests/js/opendict-loader.test.ts",
]

[tasks.js-lint]
description = "Lint TypeScript packages with Deno"
run = "deno lint"

[tasks.js-doc]
description = "Verify JSDoc completeness for TypeScript packages"
run = [
  "deno doc --lint ./packages/types/index.ts",
  "deno doc --lint ./packages/wasm/index.ts",
  "deno doc --lint ./packages/stdict-fst/index.ts",
  "deno doc --lint ./packages/stdict-cdb/index.ts",
  "deno doc --lint ./packages/opendict-fst/index.ts",
  "deno doc --lint ./packages/opendict-cdb/index.ts",
]

[tasks.js-fmt]
description = "Format TypeScript packages with Deno"
run = "deno fmt"

[tasks.js-fmt-check]
description = "Check TypeScript package formatting with Deno"
run = "deno fmt --check"

[tasks.wasm-build]
description = "Build gukhanmun-wasm WASM module for web, nodejs, and deno targets"
shell = "nu -c"
depends = ["rust-init"]
run = """
let out = $"(pwd)/packages/wasm/wasm"
wasm-pack build crates/gukhanmun-wasm --release --target web --out-dir $"($out)/web"
wasm-pack build crates/gukhanmun-wasm --release --target nodejs --out-dir $"($out)/nodejs"
wasm-pack build crates/gukhanmun-wasm --release --target deno --out-dir $"($out)/deno"
"""

[tasks.stdict-fst-data]
description = "Build gukhanmun-stdict (release) and copy FST binary to packages/stdict-fst/"
shell = "nu -c"
depends = ["rust-init"]
run = """
cargo build -p gukhanmun-stdict --release
let matches = (
  glob "target/release/build/**/out/stdict.gukfst"
  | where { |p| $p | str contains "gukhanmun-stdict" }
)
if ($matches | is-empty) {
  error make { msg: "stdict.gukfst not found after release build" }
}
cp ($matches | first) packages/stdict-fst/stdict.fst
"""

[tasks.napi-build]
description = "Build the gukhanmun-napi native Node.js addon"
shell = "nu -c"
depends = ["rust-init"]
run = """
cargo build -p gukhanmun-napi --release
match $nu.os-info.name {
  "macos" => { cp target/release/libgukhanmun_napi.dylib packages/napi/gukhanmun_napi.node }
  "windows" => { cp target/release/gukhanmun_napi.dll packages/napi/gukhanmun_napi.node }
  _ => { cp target/release/libgukhanmun_napi.so packages/napi/gukhanmun_napi.node }
}
"""

[tasks.stdict-cdb-data]
description = "Build gukhanmun-mkdict (release) and generate CDB binary to packages/stdict-cdb/"
shell = "nu -c"
depends = ["rust-init"]
run = """
let manifest_dir = $"(pwd)/crates/gukhanmun-stdict"
cargo run --release -p gukhanmun-mkdict -- --format cdb --output packages/stdict-cdb/stdict.cdb --rules $"($manifest_dir)/data/rules.tsv" $"($manifest_dir)/data/stdict.tsv"
"""

[tasks.opendict-fst-data]
description = "Build gukhanmun-opendict (release) and copy FST binaries to packages/opendict-fst/"
shell = "nu -c"
depends = ["rust-init"]
run = """
rm -rf target/release/build/gukhanmun-opendict-*
cargo build -p gukhanmun-opendict --release
let out = (
  glob "target/release/build/**/out/general.gukfst"
  | where { |p| $p | str contains "gukhanmun-opendict" }
)
if ($out | is-empty) {
  error make { msg: "opendict FST outputs not found after release build" }
}
let out = ($out | first | path dirname)
cp $"($out)/general.gukfst" packages/opendict-fst/general.fst
cp $"($out)/north-korean.gukfst" packages/opendict-fst/north-korean.fst
cp $"($out)/dialect.gukfst" packages/opendict-fst/dialect.fst
cp $"($out)/archaic.gukfst" packages/opendict-fst/archaic.fst
"""

[tasks.opendict-cdb-data]
description = "Build gukhanmun-mkdict (release) and generate CDB binaries to packages/opendict-cdb/"
shell = "nu -c"
depends = ["rust-init"]
run = """
let manifest_dir = $"(pwd)/crates/gukhanmun-opendict"
for category in [general north-korean dialect archaic] {
  cargo run --release -p gukhanmun-mkdict -- --format cdb --output $"packages/opendict-cdb/($category).cdb" $"($manifest_dir)/data/($category).tsv"
  # Store gzip-compressed so every binary stays under the JSR 20 MiB per-file
  # limit; the byte loaders inflate transparently.  -n keeps the output
  # reproducible by omitting the name and timestamp.
  gzip -9 -n -f $"packages/opendict-cdb/($category).cdb"
}
"""

[tasks.js-build]
description = "Build npm packages with tsdown (TypeScript wrappers)"
depends = [
  "wasm-build",
  "stdict-fst-data",
  "stdict-cdb-data",
  "opendict-fst-data",
  "opendict-cdb-data",
  "js-install",
]
run = "pnpm -r run build"

[tasks.js-test]
description = "Run JavaScript integration tests on Node.js, Deno, and Bun"
# Depend on js-build so the package binaries are regenerated before the tests
# start, never concurrently with them.  js-build's pnpm `prebuild` hooks re-run
# the *-data tasks (which rewrite packages/*/ binaries in place); on Windows a
# concurrent reader holding a binary open makes that rewrite fail with a
# sharing violation.  Ordering js-test after js-build removes that race.
# js-build already pulls in wasm-build, the *-data tasks, and js-install, so
# only napi-build needs to be listed alongside it here.
depends = ["js-build", "napi-build"]
# Both bindings run on all three runtimes.  The wasm binding loads its module
# and dictionary files via fetch(file://) (Deno/Bun) or node:fs (Node); the
# napi native addon needs Deno's --allow-ffi/--allow-env/--allow-sys on top of
# --allow-read.
run = [
  "node --test tests/js/wasm.test.ts tests/js/napi.test.ts tests/js/stdict-loader.test.ts tests/js/opendict-loader.test.ts",
  "deno test --allow-read --allow-env --allow-ffi --allow-sys tests/js/wasm.test.ts tests/js/napi.test.ts tests/js/stdict-loader.test.ts tests/js/opendict-loader.test.ts",
  "bun test tests/js/wasm.test.ts tests/js/napi.test.ts tests/js/stdict-loader.test.ts tests/js/opendict-loader.test.ts",
]

[tasks.js-sync-version]
description = "Write a version string to all JS package manifests"
shell = "nu -c"
run = """
let ver = if "VERSION" in $env { $env.VERSION } else {
  error make { msg: "usage: VERSION=x.y.z mise run js-sync-version" }
}

def update_json [file: string] {
  let updated = open $file | upsert version $ver | to json --indent 2
  ($updated + "\n") | save --force $file
}

for pkg in [
  packages/types packages/wasm packages/napi
  packages/napi-aarch64-apple-darwin packages/napi-x86_64-apple-darwin
  packages/napi-aarch64-pc-windows-msvc packages/napi-x86_64-pc-windows-msvc
  packages/napi-aarch64-unknown-linux-gnu packages/napi-x86_64-unknown-linux-gnu
  packages/stdict-fst packages/stdict-cdb packages/opendict-fst packages/opendict-cdb
] {
  update_json $"($pkg)/package.json"
}
for pkg in [
  packages/types packages/wasm packages/stdict-fst packages/stdict-cdb
  packages/opendict-fst packages/opendict-cdb
] {
  update_json $"($pkg)/deno.json"
}
"""

[tasks.js-version-dev]
description = "Compute a dev pre-release version and sync it to all JS manifests"
shell = "nu -c"
run = """
let build = if "BUILD" in $env { $env.BUILD } else { "0" }
let commit = (git rev-parse --short HEAD | str trim)
let base = (open Cargo.toml | get workspace.package.version)
let ver = $"($base)-dev.($build)+($commit)"
print $"Syncing JS manifests to version: ($ver)"
$env.VERSION = $ver
mise run js-sync-version
"""

[tasks.js-publish]
description = "Publish npm and JSR packages locally (manual first-publish or recovery)"
shell = "nu -c"
run = """
pnpm -r publish --no-git-checks
deno publish --allow-dirty
"""

[tasks.wasm-check]
description = "Verify gukhanmun compiles for wasm32-unknown-unknown (html+fst features)"
depends = ["rust-init"]
run = "cargo check -p gukhanmun --no-default-features --features 'html,fst' --target wasm32-unknown-unknown"

[tasks.generate-unihan]
description = "Regenerate Unihan readings and hanja variant tables"
depends = ["rust-init"]
run = "cargo run -p gukhanmun-unihan --"

[tasks.generate-unihan-check]
description = "Check generated Unihan readings and hanja variant tables"
depends = ["rust-init"]
run = "cargo run -p gukhanmun-unihan -- --check"

[tasks.gukhanmun]
description = "Run the gukhanmun plain-text CLI"
# Run in the directory mise was invoked from (default is the project root), so
# relative path arguments resolve against the user's current directory.  cargo
# still finds the workspace by walking up to its Cargo.toml.
dir = "{{cwd}}"
depends = ["rust-init"]
run = "cargo run -p gukhanmun-cli --"

[tasks.insta-review]
description = "Interactively review and accept/reject pending insta snapshots"
depends = ["rust-init"]
run = "cargo insta review"

# The ko-KR locale is generated by the docs package's own prebuild/predev
# scripts (docs/package.json `gen:ko-kr`), so `pnpm build` / `pnpm dev` fill it
# too. This task is a manual "regenerate ko-KR only" convenience.
[tasks.docs-ko-kr]
description = "Generate the hangul-only (ko-KR) docs locale from ko-Kore via the gukhanmun CLI"
run = "pnpm --filter @gukhanmun/docs run gen:ko-kr"

[tasks.docs-dev]
description = "Start the Rspress documentation dev server"
depends = [
  "wasm-build",
  "stdict-fst-data",
  "stdict-cdb-data",
  "opendict-fst-data",
  "opendict-cdb-data",
  "js-install",
]
run = [
  "pnpm --filter @gukhanmun/types --filter @gukhanmun/wasm --filter @gukhanmun/stdict-fst --filter @gukhanmun/stdict-cdb --filter @gukhanmun/opendict-fst --filter @gukhanmun/opendict-cdb --filter @gukhanmun/napi run build",
  "pnpm --filter @gukhanmun/docs run dev",
]

[tasks.docs-build]
description = "Build the Rspress documentation site for production"
depends = [
  "wasm-build",
  "stdict-fst-data",
  "stdict-cdb-data",
  "opendict-fst-data",
  "opendict-cdb-data",
  "js-install",
]
run = "pnpm --filter @gukhanmun/docs run build"

[tasks.docs-fonts]
description = "Subset Noto Sans/Serif KR to the glyphs used by the docs hero animation"
run = "node docs/scripts/subset-hero-fonts.mjs"
