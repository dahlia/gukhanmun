[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "gukhanmun"
version = "0.4.0"
description = "Convert mixed-script Korean text into hangul with native Rust performance"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Hong Minhee", email = "hong@minhee.org" }]
dependencies = []

# Official dictionary data.  Installing an extra never adds a dictionary to a
# converter.  `mise run py-sync-version` keeps these pins equal to the project
# version.
[project.optional-dependencies]
stdict = ["gukhanmun-stdict-fst==0.4.0"]
stdict-fst = ["gukhanmun-stdict-fst==0.4.0"]
stdict-cdb = ["gukhanmun-stdict-cdb==0.4.0"]
opendict = ["gukhanmun-opendict-fst==0.4.0"]
opendict-fst = ["gukhanmun-opendict-fst==0.4.0"]
opendict-cdb = ["gukhanmun-opendict-cdb==0.4.0"]
loanwords = ["gukhanmun-loanwords-fst==0.4.0"]
loanwords-fst = ["gukhanmun-loanwords-fst==0.4.0"]
loanwords-cdb = ["gukhanmun-loanwords-cdb==0.4.0"]

[project.urls]
Homepage = "https://gukhanmun.org/"
Repository = "https://github.com/dahlia/gukhanmun"
Issues = "https://github.com/dahlia/gukhanmun/issues"

[tool.maturin]
manifest-path = "../../crates/gukhanmun-python/Cargo.toml"
python-source = "src"
module-name = "gukhanmun._native"
# Tooling loads modules from the source tree; never ship its bytecode caches.
exclude = ["src/**/__pycache__/**", "src/**/*.py[cod]"]
