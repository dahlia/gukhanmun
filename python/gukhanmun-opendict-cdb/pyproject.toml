# Generated resources, provenance.json, LICENSE and ATTRIBUTION.md are staged by
# `mise run py-dicts-stage`; force-include makes a build without them fail.
[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "gukhanmun-opendict-cdb"
version = "0.4.0"
description = "Open Korean Dictionary CDB data for the gukhanmun Python package"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later AND LicenseRef-CC-BY-SA-2.0-KR"
license-files = ["LICENSE", "ATTRIBUTION.md"]
authors = [{ name = "Hong Minhee", email = "hong@minhee.org" }]
keywords = ["korean", "hanja", "hangul", "dictionary", "cdb"]
classifiers = [
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://gukhanmun.org/"
Repository = "https://github.com/dahlia/gukhanmun"
Issues = "https://github.com/dahlia/gukhanmun/issues"

# hatch_build.py fails the build when a license file is missing.
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/gukhanmun_opendict_cdb"]

[tool.hatch.build.targets.wheel.force-include]
"src/gukhanmun_opendict_cdb/general.cdb.gz" = "gukhanmun_opendict_cdb/general.cdb.gz"
"src/gukhanmun_opendict_cdb/north-korean.cdb.gz" = "gukhanmun_opendict_cdb/north-korean.cdb.gz"
"src/gukhanmun_opendict_cdb/dialect.cdb.gz" = "gukhanmun_opendict_cdb/dialect.cdb.gz"
"src/gukhanmun_opendict_cdb/archaic.cdb.gz" = "gukhanmun_opendict_cdb/archaic.cdb.gz"
"src/gukhanmun_opendict_cdb/provenance.json" = "gukhanmun_opendict_cdb/provenance.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/pyproject.toml", "/hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"src/gukhanmun_opendict_cdb/general.cdb.gz" = "src/gukhanmun_opendict_cdb/general.cdb.gz"
"src/gukhanmun_opendict_cdb/north-korean.cdb.gz" = "src/gukhanmun_opendict_cdb/north-korean.cdb.gz"
"src/gukhanmun_opendict_cdb/dialect.cdb.gz" = "src/gukhanmun_opendict_cdb/dialect.cdb.gz"
"src/gukhanmun_opendict_cdb/archaic.cdb.gz" = "src/gukhanmun_opendict_cdb/archaic.cdb.gz"
"src/gukhanmun_opendict_cdb/provenance.json" = "src/gukhanmun_opendict_cdb/provenance.json"
"LICENSE" = "LICENSE"
"ATTRIBUTION.md" = "ATTRIBUTION.md"
