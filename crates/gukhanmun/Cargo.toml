[package]
name = "gukhanmun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Umbrella library: hanja-to-hangul conversion engine with format adapters and dictionaries."

[features]
default = ["html", "markdown", "stdict", "fst", "cdb"]
html = ["dep:gukhanmun-html"]
markdown = ["dep:gukhanmun-markdown"]
fst = ["dep:gukhanmun-fst"]
cdb = ["dep:gukhanmun-cdb"]
stdict = ["dep:gukhanmun-stdict", "fst"]

[dependencies]
gukhanmun-core = { path = "../gukhanmun-core" }
gukhanmun-html = { path = "../gukhanmun-html", optional = true }
gukhanmun-markdown = { path = "../gukhanmun-markdown", optional = true }
gukhanmun-fst = { path = "../gukhanmun-fst", optional = true }
gukhanmun-cdb = { path = "../gukhanmun-cdb", optional = true }
gukhanmun-stdict = { path = "../gukhanmun-stdict", optional = true }
thiserror = { version = "2.0.18", default-features = false }
