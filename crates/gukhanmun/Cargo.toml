[package]
name = "gukhanmun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Umbrella library: hanja-to-hangul conversion engine with format adapters and dictionaries."

[features]
serde = ["gukhanmun-core/serde"]
default = ["html", "markdown", "stdict", "opendict", "loanwords", "fst", "cdb"]
html = ["dep:gukhanmun-html"]
markdown = ["dep:gukhanmun-markdown"]
fst = ["dep:gukhanmun-fst"]
cdb = ["dep:gukhanmun-cdb"]
stdict = ["dep:gukhanmun-stdict", "fst"]
opendict = ["dep:gukhanmun-opendict", "fst"]
loanwords = ["dep:gukhanmun-loanwords", "fst"]

[dependencies]
gukhanmun-core.workspace = true
gukhanmun-loanwords = { workspace = true, optional = true }
gukhanmun-html = { workspace = true, optional = true }
gukhanmun-markdown = { workspace = true, optional = true }
gukhanmun-fst = { workspace = true, optional = true }
gukhanmun-cdb = { workspace = true, optional = true }
gukhanmun-opendict = { workspace = true, optional = true }
gukhanmun-stdict = { workspace = true, optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
gukhanmun-core = { workspace = true, features = ["serde"] }
serde_json = "1.0.150"
pulldown-cmark = { version = "0.13.3", default-features = false, features = ["html"] }
libtest-mimic = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.12"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
harness = false
