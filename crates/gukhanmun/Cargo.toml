[package]
name = "gukhanmun"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Umbrella library: hanja-to-hangul conversion engine with format adapters and dictionaries."

[features]
default = ["html", "markdown", "stdict", "fst", "cdb"]
html = ["dep:gukhanmun-html"]
markdown = ["dep:gukhanmun-markdown"]
fst = ["dep:gukhanmun-fst"]
cdb = ["dep:gukhanmun-cdb"]
stdict = ["dep:gukhanmun-stdict", "fst"]

[dependencies]
gukhanmun-core.workspace = true
gukhanmun-html = { workspace = true, optional = true }
gukhanmun-markdown = { workspace = true, optional = true }
gukhanmun-fst = { workspace = true, optional = true }
gukhanmun-cdb = { workspace = true, optional = true }
gukhanmun-stdict = { workspace = true, optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
libtest-mimic = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.12"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
harness = false
