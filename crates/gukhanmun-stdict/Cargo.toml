[package]
name = "gukhanmun-stdict"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Bundled Standard Korean Language Dictionary for gukhanmun."

[[bin]]
name = "gukhanmun-stdict-extract"
path = "src/bin/extract.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
gukhanmun-fst.workspace = true
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[build-dependencies]
anyhow = "1.0.102"
gukhanmun-mkdict.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
gukhanmun-core.workspace = true
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.27.0"
tracing = { version = "0.1.41", features = ["std"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
