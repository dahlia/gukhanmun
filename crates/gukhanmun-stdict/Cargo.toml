[package]
name = "gukhanmun-stdict"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Bundled Standard Korean Language Dictionary for gukhanmun."

[[bin]]
name = "gukhanmun-stdict-extract"
path = "src/bin/extract.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
gukhanmun-fst = { path = "../gukhanmun-fst" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[build-dependencies]
anyhow = "1.0.102"
gukhanmun-mkdict = { path = "../gukhanmun-mkdict" }

[dev-dependencies]
assert_cmd = "2.2.2"
gukhanmun-core = { path = "../gukhanmun-core" }
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.27.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
