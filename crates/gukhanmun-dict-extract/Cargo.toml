[package]
name = "gukhanmun-dict-extract"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared dictionary dump extraction helpers for gukhanmun."

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
gukhanmun-core.workspace = true
tempfile = "3.27.0"
same-file = "1.0.6"
clap = { version = "4.6.1", features = ["derive"], optional = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
log = { version = "0.4.29", features = ["max_level_debug"], optional = true }

[features]
default = []
loanwords-cli = ["dep:clap"]
loanwords-collect = ["loanwords-cli", "dep:ureq", "dep:log"]

[[bin]]
name = "gukhanmun-loanwords"
path = "src/bin/loanwords.rs"
required-features = ["loanwords-cli"]
# The runtime crate uses the same rustdoc target name; CLI internals are private.
doc = false

[dev-dependencies]
gukhanmun-mkdict.workspace = true
gukhanmun-fst.workspace = true
gukhanmun-cdb.workspace = true
