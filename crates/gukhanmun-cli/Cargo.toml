[package]
name = "gukhanmun-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Command-line interface for gukhanmun plain-text conversion."

[[bin]]
name = "gukhanmun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
gukhanmun-core = { path = "../gukhanmun-core" }
gukhanmun-fst = { path = "../gukhanmun-fst" }
gukhanmun-stdict = { path = "../gukhanmun-stdict" }

[dev-dependencies]
assert_cmd = "2.2.2"
gukhanmun-mkdict = { path = "../gukhanmun-mkdict" }
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.27.0"
