[package]
name = "gukhanmun-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Command-line interface for gukhanmun plain-text conversion."

[[bin]]
name = "gukhanmun"
path = "src/main.rs"
# Avoid a rustdoc output-filename clash with the library target of the same
# name in the umbrella `gukhanmun` crate. The CLI's internals are not part of
# any documented public API surface, so no docs are lost.
doc = false

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
gukhanmun.workspace = true
hongdown = "0.3.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.2.2"
gukhanmun-mkdict.workspace = true
predicates = "3.1.3"
proptest = "1.9.0"
tempfile = "3.27.0"
