[package]
name = "gukhanmun-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "WebAssembly binding for Gukhanmun via wasm-bindgen."

[lib]
crate-type = ["cdylib"]

[dependencies]
gukhanmun = { path = "../gukhanmun", version = "0.1.0", default-features = false, features = ["html", "fst", "markdown"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tracing = { version = "0.1", features = ["release_max_level_off"] }
wasm-bindgen = "0.2"
