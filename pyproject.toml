[project]
name = "gukhanmun-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

# The core extras require these unpublished members; resolve them locally.
[tool.uv.sources]
gukhanmun-stdict-fst = { workspace = true }
gukhanmun-stdict-cdb = { workspace = true }
gukhanmun-opendict-fst = { workspace = true }
gukhanmun-opendict-cdb = { workspace = true }
gukhanmun-loanwords-fst = { workspace = true }
gukhanmun-loanwords-cdb = { workspace = true }

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "mypy" },
    { include-group = "build" },
    "packaging==26.3",
    "pyright==1.1.414",
    "basedpyright==1.40.2",
    "ty==0.0.99",
    "pyrefly==1.4.1",
    "tox==4.67.13",
    "tox-uv-bare==1.37.7",
]
test = ["pytest==9.2.0"]
mypy = ["mypy==2.4.1"]
# Build backends of the dictionary data distributions and the native package;
# exported as hashed build constraints by scripts/python/dictionaries.py and
# scripts/python/dists.py.
build = ["hatchling==1.33.0", "maturin==1.16.0"]
