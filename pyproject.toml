[project]
name = "gukhanmun-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["python/*"]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "mypy" },
    "packaging==26.3",
    "maturin==1.16.0",
    "pyright==1.1.414",
    "basedpyright==1.40.2",
    "ty==0.0.99",
    "pyrefly==1.4.1",
    "tox==4.67.13",
    "tox-uv-bare==1.37.7",
]
test = ["pytest==9.2.0"]
mypy = ["mypy==2.4.1"]
