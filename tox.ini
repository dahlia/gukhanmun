[tox]
env_list = py311, py312, py313, py314, py315, pypy311, pypy312
skip_missing_interpreters = false
work_dir = {tox_root}/target/tox

[testenv]
runner = uv-venv-lock-runner
# The lock runner builds noneditable wheels through uv, not a shared tox pkg env.
package = wheel
package_root = {tox_root}
dependency_groups = test
base_python = {env:GUKHANMUN_PYTHON:__set-by-py-test-all__}
uv_python_preference = only-system
uv_sync_flags =
    --package
    gukhanmun
    --reinstall-package
    gukhanmun
    --config-settings-package
    gukhanmun:build-args=--locked
pass_env =
    RUSTUP_TOOLCHAIN
    RUSTUP_HOME
    CARGO_HOME
    CARGO_*
    GUKHANMUN_*
set_env =
    UV_PYTHON_DOWNLOADS = never
    UV_PYTHON_PREFERENCE = only-system
    UV_FROZEN = false
commands = python -I {tox_root}/scripts/python/matrix.py --semantic
