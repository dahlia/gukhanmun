name: update loanword data

on:
  schedule:
  - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loanword-data-update
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'dahlia/gukhanmun' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      status: ${{ steps.collect.outputs.status }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: refs/heads/main
        persist-credentials: false
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        cache: true
    - name: Build collector without API credentials
      run: mise run loanwords-tools
    - name: Collect and validate complete source
      id: collect
      env:
        NIKL_LOANWORD_API_KEY: ${{ secrets.NIKL_LOANWORD_API_KEY }}
        GUKHANMUN_LOANWORDS_BIN: ${{ github.workspace }}/target/loanwords-tools/debug/gukhanmun-loanwords
        GUKHANMUN_LOANWORDS_RESULT: ${{ runner.temp }}/loanword-result.json
      run: |
        set -euo pipefail
        mise run loanwords-update
        mise exec -- deno run -A scripts/loanwords/publish.ts bundle "$RUNNER_TEMP/loanword-update"
    - name: Verify successful updates offline
      if: steps.collect.outputs.status == 'updated'
      run: mise run ci
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: loanword-update
        path: ${{ runner.temp }}/loanword-update/
        retention-days: 7
        if-no-files-found: error

  publish:
    needs: collect
    if: github.repository == 'dahlia/gukhanmun' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      with:
        cache: true
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: loanword-update
        path: ${{ runner.temp }}/loanword-update/
    - name: Publish validated update PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: mise exec -- deno run -A scripts/loanwords/publish.ts publish "$RUNNER_TEMP/loanword-update"
