name: main

on:
  pull_request:
  push:
    branches:
    - "**"
    tags:
    - "**"

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runs of the full gate already took up to 44 minutes before the
    # Python data distribution tasks were added; the standalone native sdist
    # rebuild adds another release compile.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
    # Work around jdx/mise-action not caching ~/.rustup alongside
    # ~/.local/share/mise, which causes Rust components (e.g. clippy) to go
    # missing on cache hits. See: https://github.com/jdx/mise-action/issues/215
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        echo "::group::Runner"
        echo "RUNNER_OS=$RUNNER_OS"
        echo "RUNNER_ARCH=$RUNNER_ARCH"
        echo "RUNNER_DEBUG=${RUNNER_DEBUG:-}"
        uname -a || true
        sw_vers || true
        cmd /c ver || true
        df -h || true
        echo "::endgroup::"

        echo "::group::Git"
        git status --short
        git rev-parse HEAD
        git branch -avv
        echo "::endgroup::"

        echo "::group::Tools"
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        dasel version
        jq --version
        echo "::endgroup::"

        echo "::group::Cargo workspace"
        cargo metadata --no-deps --format-version 1 |
          jq '{workspace_root, target_directory, packages: [.packages[] | {name, version, manifest_path}]}'
        cargo tree --workspace --edges normal,build,dev
        echo "::endgroup::"
    - name: Run CI
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
          export MISE_VERBOSE=1
        fi

        mise run ci

  python-semantic:
    name: Python semantic (${{ matrix.os }}, ${{ matrix.environment }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        environment:
        - py311
        - py312
        - py313
        - py314
        - py315
        - pypy311
        - pypy312
        include:
        - os: macos-latest
          environment: py311
        - os: macos-latest
          environment: pypy311
        - os: macos-latest
          environment: pypy312
        - os: windows-latest
          environment: py311
        - os: windows-latest
          environment: pypy311
        - os: windows-latest
          environment: pypy312
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
    # Cache tools only; each job builds and installs its own native wheel.
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: python-rustup-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment }}-${{ hashFiles('mise*.toml', 'uv.lock', 'Cargo.lock', '**/Cargo.toml', '**/pyproject.toml', 'tox.ini') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
        cache_key_prefix: python-semantic-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment }}-${{ hashFiles('mise*.toml', 'uv.lock', 'Cargo.lock', '**/Cargo.toml', '**/pyproject.toml', 'tox.ini') }}
    - name: Install the selected mise interpreter
      shell: bash
      env:
        PYTHON_ENV: ${{ matrix.environment }}
      run: |
        set -euo pipefail
        python_pin="$(mise exec --no-deps -- python scripts/python/matrix.py --pin "$PYTHON_ENV")"
        python_pin="${python_pin%$'\r'}"
        mise install "python@$python_pin"
    - name: Run installed-wheel semantic tests
      shell: bash
      env:
        PYTHON_ENV: ${{ matrix.environment }}
      run: |
        set -euo pipefail
        mise run py-test-all -- -e "$PYTHON_ENV"

  python-context:
    name: Python artifact context
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.context.outputs.matrix }}
      pypi-version: ${{ steps.context.outputs.pypi-version }}
    steps:
    - uses: actions/checkout@v6
      with:
        # Downloaded build tools run in these jobs; nothing needs the token.
        persist-credentials: false
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        # Exporting the environment would evaluate mise.toml's UV_PYTHON
        # template before any Python is installed, which fails.
        env: false
    - name: Compute the target matrix and artifact version
      id: context
      shell: bash
      env:
        MISE_EXEC_AUTO_INSTALL: "false"
      run: |
        set -euo pipefail
        mise install uv python@3.15.2
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/artifacts.py ci-context

  python-sdist:
    name: Python sdists and data wheels
    runs-on: ubuntu-latest
    needs: python-context
    timeout-minutes: 60
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
    steps:
    - uses: actions/checkout@v6
      with:
        # Downloaded build tools run in these jobs; nothing needs the token.
        persist-credentials: false
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Build the sdists and rebuild each one outside the checkout
      shell: bash
      run: |
        set -euo pipefail
        mise run py-deps
        uv run --no-sync python -I scripts/python/artifacts.py stamp
        mise run py-sdist-test
        mkdir -p dist
        cp target/python/sdist/*.tar.gz target/python/dictionaries/gukhanmun-*/*.tar.gz \
          target/python/dictionaries/gukhanmun-*/*.whl dist/
        cp target/python/sdist-rebuilt/rebuilds.json dist/
        cp target/python/smoke/sdist-rebuild.json dist/smoke-sdist-rebuild.json
        mkdir -p data
        cp target/python/dictionaries/gukhanmun-*/*.whl data/
    - uses: actions/upload-artifact@v7
      with:
        name: python-sdists
        path: dist/
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: python-data-wheels
        path: data/
        if-no-files-found: error

  python-wheels:
    name: Python wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: python-context
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-context.outputs.matrix) }}
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
      with:
        # Downloaded build tools run in these jobs; nothing needs the token.
        persist-credentials: false
    # Only mise itself: the full tool set does not exist for every target, and
    # automatic dependency setup would build unrelated tools.
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        # Exporting the environment would evaluate mise.toml's UV_PYTHON
        # template before any Python is installed, which fails.
        env: false
    - name: Install the pinned interpreters and uv
      shell: bash
      env:
        PYTHONS: ${{ matrix.pythons }}
      run: |
        set -euo pipefail
        read -ra pythons <<< "$PYTHONS"
        mise install uv "${pythons[@]}"
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        echo "GUKHANMUN_TOOLS_PYTHON=$tools" >> "$GITHUB_ENV"
    - name: Stamp the artifact version
      shell: bash
      run: mise exec --no-deps uv python@3.15.2 -- "$GUKHANMUN_TOOLS_PYTHON" -I scripts/python/artifacts.py stamp
    - name: Build the wheels
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        mise exec --no-deps uv python@3.15.2 -- "$GUKHANMUN_TOOLS_PYTHON" -I scripts/python/artifacts.py \
          build --target "$TARGET" --out dist
    - name: Audit the wheels
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        mise exec --no-deps uv python@3.15.2 -- "$GUKHANMUN_TOOLS_PYTHON" -I scripts/python/artifacts.py \
          audit --target "$TARGET" --out dist
    # A flat upload, so the set merges into one directory downstream.
    - name: Collect the wheels and their records
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p upload
        cp dist/wheels/*.whl dist/build-info-*.json dist/audit-*.json upload/
    - uses: actions/upload-artifact@v7
      with:
        name: python-wheels-${{ matrix.target }}
        path: upload/
        if-no-files-found: error

  python-wheel-test:
    name: Python wheel tests (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: [python-context, python-sdist, python-wheels]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-context.outputs.matrix) }}
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
      with:
        # Downloaded build tools run in these jobs; nothing needs the token.
        persist-credentials: false
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        # Exporting the environment would evaluate mise.toml's UV_PYTHON
        # template before any Python is installed, which fails.
        env: false
    # No Rust is installed for these jobs; the smoke runner also builds its
    # PATH from the venv alone, so the runner's own Rust cannot be reached.
    - name: Install the pinned interpreters and uv
      shell: bash
      env:
        PYTHONS: ${{ matrix.pythons }}
      run: |
        set -euo pipefail
        read -ra pythons <<< "$PYTHONS"
        mise install uv "${pythons[@]}"
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        echo "GUKHANMUN_TOOLS_PYTHON=$tools" >> "$GITHUB_ENV"
    - name: Stamp the artifact version
      shell: bash
      run: mise exec --no-deps uv python@3.15.2 -- "$GUKHANMUN_TOOLS_PYTHON" -I scripts/python/artifacts.py stamp
    - uses: actions/download-artifact@v8
      with:
        name: python-wheels-${{ matrix.target }}
        path: dist
    - uses: actions/download-artifact@v8
      with:
        name: python-data-wheels
        path: data
    - name: Install and execute the wheels without Rust
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        mkdir -p dist/wheels
        mv dist/*.whl dist/wheels/
        mise exec --no-deps uv python@3.15.2 -- "$GUKHANMUN_TOOLS_PYTHON" -I scripts/python/artifacts.py \
          test --target "$TARGET" --out dist --data data
    - uses: actions/upload-artifact@v7
      with:
        name: python-evidence-${{ matrix.target }}
        path: dist/smoke-*.json
        if-no-files-found: error

  python-dists:
    name: Python artifact set
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.manifest.outputs.manifest-sha256 }}
    runs-on: ubuntu-latest
    needs: [python-context, python-sdist, python-wheels, python-wheel-test]
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
    - uses: actions/checkout@v6
      with:
        # Downloaded build tools run in these jobs; nothing needs the token.
        persist-credentials: false
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        # Exporting the environment would evaluate mise.toml's UV_PYTHON
        # template before any Python is installed, which fails.
        env: false
    - uses: actions/download-artifact@v8
      with:
        path: python-dists
        pattern: "{python-sdists,python-wheels-*,python-evidence-*}"
        merge-multiple: true
    - name: Write and verify the manifest of the complete set
      id: manifest
      shell: bash
      run: |
        set -euo pipefail
        mise install uv python@3.15.2
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/artifacts.py stamp
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/artifacts.py manifest --dir python-dists
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/artifacts.py verify --dir python-dists \
          --complete
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/publish.py validate \
          --dir python-dists --version "$PYPI_VERSION"
        echo "manifest-sha256=$(sha256sum python-dists/manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    # Keep the immutable upload last: a failed later step would make a
    # failed-job rerun collide with this successful artifact name.
    - uses: actions/upload-artifact@v7
      id: upload
      with:
        name: python-dists
        path: python-dists/
        retention-days: 90
        if-no-files-found: error

  python-publish-check:
    name: Python publication validation
    runs-on: ubuntu-latest
    needs: [python-context, python-dists]
    timeout-minutes: 15
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        env: false
    - name: Require the original Python artifact identity
      shell: bash
      env:
        ARTIFACT_ID: ${{ needs.python-dists.outputs.artifact-id }}
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Missing or invalid original Python artifact ID or manifest digest"
          exit 1
        fi
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.python-dists.outputs.artifact-id }}
        path: python-dists
    - name: Validate the original bundle without credentials or registry access
      shell: bash
      env:
        ARTIFACT_ID: ${{ needs.python-dists.outputs.artifact-id }}
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        test -f python-dists/manifest.json
        mise install uv python@3.15.2
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/publish.py validate \
          --dir python-dists --version "$PYPI_VERSION" --artifact-id "$ARTIFACT_ID" \
          --manifest-sha256 "$MANIFEST_SHA256" --receipt python-validation-receipt.json
    - uses: actions/upload-artifact@v7
      with:
        name: python-validation-receipt-${{ github.run_attempt }}
        path: python-validation-receipt.json
        if-no-files-found: error

  publish-python:
    name: publish Python packages
    runs-on: ubuntu-latest
    needs: [ci, python-semantic, artifact-context, python-context, python-dists, python-publish-check]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'dahlia/gukhanmun' &&
      (
        github.ref_type == 'tag' ||
        github.ref == 'refs/heads/main' ||
        (github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '-maintenance'))
      ) &&
      needs.artifact-context.outputs.should-publish == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_VERSION: ${{ needs.python-context.outputs.pypi-version }}
      MISE_EXEC_AUTO_INSTALL: "false"
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: jdx/mise-action@v4
      with:
        install: false
        cache: false
        env: false
    - name: Require the original Python artifact identity
      shell: bash
      env:
        ARTIFACT_ID: ${{ needs.python-dists.outputs.artifact-id }}
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Missing or invalid original Python artifact ID or manifest digest"
          exit 1
        fi
    - name: Require matching independent publication context
      shell: bash
      env:
        CONTEXT_VERSION: ${{ needs.artifact-context.outputs.python-version }}
        PYTHON_ELIGIBLE: ${{ needs.artifact-context.outputs.python-eligible }}
        PYTHON_REASON: ${{ needs.artifact-context.outputs.python-reason }}
      run: |
        set -euo pipefail
        if [[ -z "$PYPI_VERSION" || -z "$CONTEXT_VERSION" || "$PYPI_VERSION" != "$CONTEXT_VERSION" || "$PYTHON_ELIGIBLE" != true ]]; then
          printf '::error::Invalid Python publication context: %s\n' "$PYTHON_REASON"
          exit 1
        fi
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.python-dists.outputs.artifact-id }}
        path: python-dists
    - name: Publish only the validated original files through OIDC
      shell: bash
      env:
        ARTIFACT_ID: ${{ needs.python-dists.outputs.artifact-id }}
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        mise install uv python@3.15.2
        tools="$(mise exec --no-deps uv python@3.15.2 -- python -I scripts/python/artifacts.py tools | tail -n 1)"
        mise exec --no-deps uv python@3.15.2 -- "$tools" -I scripts/python/publish.py publish \
          --dir python-dists --version "$PYPI_VERSION" --artifact-id "$ARTIFACT_ID" \
          --manifest-sha256 "$MANIFEST_SHA256" --receipt python-publish-receipt.json
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: python-publish-receipt-${{ github.run_attempt }}
        path: python-publish-receipt.json
        if-no-files-found: warn

  publish:
    name: publish crates
    runs-on: ubuntu-latest
    needs:
    - artifact-context
    - package-crates
    - build-release-binaries
    if: needs.artifact-context.outputs.should-publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        git status --short
        git rev-parse HEAD
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        dasel version
        jq --version
        cargo metadata --no-deps --format-version 1 |
          jq '{workspace_root, target_directory, packages: [.packages[] | {name, version, manifest_path}]}'
    - name: Prepare dev publish version
      shell: bash
      env:
        PUBLISH_VERSION: ${{ needs.artifact-context.outputs.version }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        base_version="$(dasel -i toml -o yaml 'workspace.package.version' < Cargo.toml)"
        publish_version="$PUBLISH_VERSION"
        if [[ "$publish_version" == "$base_version" ]]; then
          exit 0
        fi

        edit_toml() {
          local query="$1"
          dasel -i toml --root "$query" < Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
        }

        edit_toml "workspace.package.version = \"$publish_version\""
        dasel -i toml -o json 'workspace.dependencies' < Cargo.toml |
          jq -r 'keys[]' |
          while read -r crate
        do
          edit_toml "workspace.dependencies.get(\"$crate\").version = \"$publish_version\""
        done

        cargo update --workspace

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Cargo.toml Cargo.lock
        git commit -m "Prepare dev publish $publish_version"

        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          git status --short
          git show --stat --oneline --no-renames HEAD
        fi
    - uses: rust-lang/crates-io-auth-action@v1
      id: auth
    - name: Publish workspace
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      shell: bash
      run: |
        set -euo pipefail

        args=(
          release publish
          --config .github/cargo-release-publish.toml
          --workspace
          --execute
          --no-confirm
          --allow-branch '*'
        )
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
          args+=(-v)
        fi

        set +e
        cargo "${args[@]}" 2>&1 | tee cargo-release-publish.log
        status="${PIPESTATUS[0]}"
        set -e

        if [[ "$status" -ne 0 ]]; then
          if grep -q "no packages selected" cargo-release-publish.log &&
            grep -q "disabled due to previous publish" cargo-release-publish.log
          then
            echo "All selected packages were already published; treating this as success."
          else
            exit "$status"
          fi
        fi

  artifact-context:
    name: artifact context
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        endsWith(github.ref_name, '-maintenance') ||
        github.ref_type == 'tag'
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      should-publish: ${{ steps.version.outputs.should-publish }}
      python-version: ${{ steps.python-version.outputs.python-version }}
      python-eligible: ${{ steps.python-version.outputs.python-eligible }}
      python-reason: ${{ steps.python-version.outputs.python-reason }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        git status --short
        git rev-parse HEAD
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        dasel version
        jq --version
        cargo metadata --no-deps --format-version 1 |
          jq '{workspace_root, target_directory, packages: [.packages[] | {name, version, manifest_path}]}'
    - name: Verify signed release tag
      if: github.ref_type == 'tag'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
          echo "::error::Release tag $GITHUB_REF_NAME must be an annotated signed tag"
          exit 1
        fi

        tag_object="$(
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object'
        )"
        tag_type="$(jq -r '.type' <<< "$tag_object")"
        tag_sha="$(jq -r '.sha' <<< "$tag_object")"
        if [[ "$tag_type" != "tag" ]]; then
          echo "::error::Release tag $GITHUB_REF_NAME must be an annotated signed tag"
          exit 1
        fi

        signed_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
        verification="$(jq '.verification' <<< "$signed_tag")"
        verified="$(jq -r '.verified' <<< "$verification")"
        reason="$(jq -r '.reason' <<< "$verification")"
        if [[ "$verified" != "true" ]]; then
          echo "::error::Release tag $GITHUB_REF_NAME signature is not verified: $reason"
          exit 1
        fi
        mise exec --no-deps -- python -I scripts/python/verify_tag.py \
          --tag "$GITHUB_REF_NAME" --ref-object "$tag_object" <<< "$signed_tag"
    - name: Resolve artifact version
      id: version
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        workspace_version="$(dasel -i toml -o yaml 'workspace.package.version' < Cargo.toml)"
        should_publish=true
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use x.y.z without a v prefix: $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "$workspace_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match workspace.package.version $workspace_version"
            exit 1
          fi

          artifact_version="$workspace_version"
        elif [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+-maintenance$ ]]; then
          short_sha="$(git rev-parse --short "$GITHUB_SHA")"
          artifact_version="${workspace_version}-dev.${GITHUB_RUN_NUMBER}+${short_sha}"
        else
          should_publish=false
          artifact_version="$workspace_version"
        fi

        {
          echo "version=$artifact_version"
          echo "should-publish=$should_publish"
        } >> "$GITHUB_OUTPUT"
    - name: Resolve the independent Python publication context
      id: python-version
      continue-on-error: true
      shell: bash
      run: |
        # Automatic uv dependency setup installs locked tools without building
        # workspace packages. A Python infrastructure error must not suppress
        # the existing Rust/npm outputs; publish-python rejects missing ones.
        mise exec -- uv run --no-sync python -I scripts/python/release_context.py

  package-crates:
    name: package crates
    runs-on: ubuntu-latest
    needs: artifact-context
    if: needs.artifact-context.outputs.should-publish == 'true'
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        git status --short
        git rev-parse HEAD
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        dasel version
        jq --version
        cargo metadata --no-deps --format-version 1 |
          jq '{workspace_root, target_directory, packages: [.packages[] | {name, version, manifest_path}]}'
    - name: Prepare dev artifact version
      if: github.ref_type != 'tag'
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        edit_toml() {
          local query="$1"
          dasel -i toml --root "$query" < Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
        }

        edit_toml "workspace.package.version = \"${{ needs.artifact-context.outputs.version }}\""
        dasel -i toml -o json 'workspace.dependencies' < Cargo.toml |
          jq -r 'keys[]' |
          while read -r crate
        do
          crate="${crate%$'\r'}"
          edit_toml "workspace.dependencies.get(\"$crate\").version = \"${{ needs.artifact-context.outputs.version }}\""
        done

        cargo update --workspace
    - name: Package crates
      shell: bash
      run: |
        set -euo pipefail

        args=(package --workspace --locked --allow-dirty)
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
          args+=(-v)
        fi

        cargo "${args[@]}"
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          find target/package -maxdepth 1 -type f -name '*.crate' -print -exec ls -lh {} \;
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: crate-packages
        path: target/package/*.crate
        if-no-files-found: error

  build-napi:
    name: build napi addon (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: macos-latest
          target: x86_64-apple-darwin
        - os: windows-latest
          target: aarch64-pc-windows-msvc
        - os: windows-latest
          target: x86_64-pc-windows-msvc
        - os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - uses: taiki-e/setup-cross-toolchain-action@v1
      with:
        target: ${{ matrix.target }}
        runner: none
    - name: Build NAPI addon
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        cargo build --locked --release --target ${{ matrix.target }} -p gukhanmun-napi
    - name: Collect binary
      shell: bash
      run: |
        set -euo pipefail
        case "${{ matrix.target }}" in
          *-apple-darwin)
            cp target/${{ matrix.target }}/release/libgukhanmun_napi.dylib gukhanmun_napi.node
            ;;
          *-windows-*)
            cp target/${{ matrix.target }}/release/gukhanmun_napi.dll gukhanmun_napi.node
            ;;
          *)
            cp target/${{ matrix.target }}/release/libgukhanmun_napi.so gukhanmun_napi.node
            ;;
        esac
    - uses: actions/upload-artifact@v7
      with:
        name: napi-${{ matrix.target }}
        path: gukhanmun_napi.node
        if-no-files-found: error

  build-release-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: artifact-context
    if: needs.artifact-context.outputs.should-publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: aarch64-apple-darwin
          archive: tar.bz2
          exe: ""
        - os: macos-latest
          target: x86_64-apple-darwin
          archive: tar.bz2
          exe: ""
        - os: windows-latest
          target: aarch64-pc-windows-msvc
          archive: zip
          exe: ".exe"
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          archive: zip
          exe: ".exe"
        - os: ubuntu-latest
          target: aarch64-unknown-linux-musl
          archive: tar.bz2
          exe: ""
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          archive: tar.bz2
          exe: ""
    steps:
    - name: Disable Git CRLF conversion
      if: runner.os == 'Windows'
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        echo "target=${{ matrix.target }}"
        git status --short
        git rev-parse HEAD
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        cargo metadata --no-deps --format-version 1 |
          jq '{workspace_root, target_directory, packages: [.packages[] | {name, version, manifest_path}]}'
    - uses: taiki-e/setup-cross-toolchain-action@v1
      with:
        target: ${{ matrix.target }}
        runner: none
    - name: Dump debug target context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        rustup target list --installed
        rustc -Vv --target ${{ matrix.target }} || true
    - name: Prepare dev artifact version
      if: github.ref_type != 'tag'
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        edit_toml() {
          local query="$1"
          dasel -i toml --root "$query" < Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
        }

        edit_toml "workspace.package.version = \"${{ needs.artifact-context.outputs.version }}\""
        dasel -i toml -o json 'workspace.dependencies' < Cargo.toml |
          jq -r 'keys[]' |
          while read -r crate
        do
          crate="${crate%$'\r'}"
          edit_toml "workspace.dependencies.get(\"$crate\").version = \"${{ needs.artifact-context.outputs.version }}\""
        done

        cargo update --workspace
    - name: Verify release binary package versions
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        actual_versions="$(
          cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "gukhanmun-cli" or .name == "gukhanmun-mkdict") | "\(.name)=\(.version)"'
        )"

        for package in gukhanmun-cli gukhanmun-mkdict; do
          if ! grep -Fxq "$package=${{ needs.artifact-context.outputs.version }}" <<< "$actual_versions"; then
            echo "::error::$package version does not match artifact version ${{ needs.artifact-context.outputs.version }}"
            echo "$actual_versions"
            exit 1
          fi
        done
    - name: Configure Windows CRT static linking
      if: endsWith(matrix.target, '-pc-windows-msvc')
      shell: bash
      run: |
        set -euo pipefail
        printf 'RUSTFLAGS=%s-C target-feature=+crt-static\n' \
          "${RUSTFLAGS:+$RUSTFLAGS }" >> "$GITHUB_ENV"
    - name: Build release binaries
      shell: bash
      run: |
        set -euo pipefail

        args=(
          build
          --locked
          --release
          --target ${{ matrix.target }}
          -p gukhanmun-cli
          -p gukhanmun-mkdict
        )
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
          args+=(-vv)
        fi

        cargo "${args[@]}"
    - name: Verify Windows release binary CRT linkage
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $installPath) {
          throw "Visual Studio with VC tools was not found."
        }

        $vsDevCmd = Join-Path $installPath "Common7\Tools\VsDevCmd.bat"
        $binaries = @(
          "target/${{ matrix.target }}/release/gukhanmun${{ matrix.exe }}",
          "target/${{ matrix.target }}/release/gukhanmun-mkdict${{ matrix.exe }}"
        )
        $forbiddenPattern = "^\s*(vcruntime.*|msvcp.*|concrt.*|ucrtbase|api-ms-win-crt-.*)\.dll\s*$"

        foreach ($binary in $binaries) {
          $script = @"
        call "$vsDevCmd" -no_logo -arch=x64
        dumpbin /dependents "$binary"
        "@
          $batchFile = Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName() + ".cmd")
          Set-Content -Path $batchFile -Value $script -Encoding ASCII
          try {
            $output = & cmd.exe /d /q /c "`"$batchFile`"" 2>&1
            $exitCode = $LASTEXITCODE
          } finally {
            Remove-Item $batchFile
          }

          $output | Write-Output
          if ($exitCode -ne 0) {
            throw "dumpbin failed for $binary with exit code $exitCode."
          }

          $forbidden = $output | Where-Object { $_ -match $forbiddenPattern }
          if ($forbidden) {
            throw "$binary imports dynamic CRT DLLs: $($forbidden -join ', ')"
          }
        }
    - name: Archive release binaries
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          set -x
        fi

        asset="gukhanmun-${{ needs.artifact-context.outputs.version }}-${{ matrix.target }}"
        mkdir -p "dist/$asset"
        cp "target/${{ matrix.target }}/release/gukhanmun${{ matrix.exe }}" "dist/$asset/"
        cp "target/${{ matrix.target }}/release/gukhanmun-mkdict${{ matrix.exe }}" "dist/$asset/"
        cp LICENSE NOTICE.md README.*.md "dist/$asset/"

        if [[ "${{ matrix.archive }}" == "zip" ]]; then
          (cd "dist/$asset" && 7z a "../$asset.zip" \
            LICENSE NOTICE.md README.*.md \
            "gukhanmun${{ matrix.exe }}" \
            "gukhanmun-mkdict${{ matrix.exe }}")
        else
          tar -cjf "dist/$asset.tar.bz2" -C "dist/$asset" \
            LICENSE NOTICE.md README.*.md \
            "gukhanmun${{ matrix.exe }}" \
            "gukhanmun-mkdict${{ matrix.exe }}"
        fi

        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then
          find dist -maxdepth 2 -type f -print -exec ls -lh {} \;
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.target }}
        path: dist/gukhanmun-${{ needs.artifact-context.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
        if-no-files-found: error

  publish-js:
    name: publish JS packages
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
    - artifact-context
    - build-napi
    if: needs.artifact-context.outputs.should-publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - uses: actions/setup-node@v6
      with:
        registry-url: 'https://registry.npmjs.org'
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        git status --short
        git rev-parse HEAD
        mise --version
        mise ls
        rustup show
        rustc -Vv
        cargo -Vv
        node --version
        pnpm --version
        deno --version
    - name: Build WASM and dictionary data
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        mise run wasm-build
        mise run stdict-fst-data
        mise run stdict-cdb-data
        mise run opendict-fst-data
        mise run opendict-cdb-data
        mise run loanwords-fst-data
        mise run loanwords-cdb-data
    - name: Sync JS manifest versions
      shell: bash
      env:
        VERSION: ${{ needs.artifact-context.outputs.version }}
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        mise run js-sync-version
    - name: Download NAPI platform binaries
      uses: actions/download-artifact@v8
      with:
        pattern: napi-*
        merge-multiple: false
        path: napi-artifacts
    - name: Place binaries in platform packages
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        for target in \
          aarch64-apple-darwin x86_64-apple-darwin \
          aarch64-pc-windows-msvc x86_64-pc-windows-msvc \
          aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
          cp napi-artifacts/napi-${target}/gukhanmun_napi.node \
             packages/napi-${target}/gukhanmun_napi.node
        done
    - name: Build npm packages
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        mise run js-install
        pnpm -r --workspace-concurrency=1 run build
    - name: Pack npm packages
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        mkdir -p npm-dist
        pnpm -r pack --pack-destination "$(pwd)/npm-dist"
    - uses: actions/upload-artifact@v7
      with:
        name: npm-packages
        path: npm-dist/*.tgz
        if-no-files-found: error
    - name: Publish to npm
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi
        dist_tag="latest"
        if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
          dist_tag="dev"
        fi
        pnpm -r \
          --filter '@gukhanmun/napi-*' \
          publish \
          --no-git-checks \
          --tag "$dist_tag" \
          --provenance \
          --access public
        pnpm -r \
          --filter '@gukhanmun/napi' \
          publish \
          --no-git-checks \
          --tag "$dist_tag" \
          --provenance \
          --access public
        pnpm -r \
          --filter '!@gukhanmun/napi*' \
          publish \
          --no-git-checks \
          --tag "$dist_tag" \
          --provenance \
          --access public
    - name: Publish to JSR
      shell: bash
      timeout-minutes: 45
      run: |
        set -euo pipefail
        if [[ "${RUNNER_DEBUG:-}" == "1" ]]; then set -x; fi

        max_attempts=30
        timeout_seconds=60
        retry_sleep_seconds=10

        for attempt in $(seq 1 "$max_attempts"); do
          echo "Publishing to JSR (attempt ${attempt}/${max_attempts})..."
          if timeout --kill-after=15s "${timeout_seconds}s" \
            deno publish --allow-dirty; then
            exit 0
          fi

          status=$?
          if [[ "$attempt" -eq "$max_attempts" ]]; then
            echo "deno publish failed after ${max_attempts} attempts; last exit status: ${status}" >&2
            exit "$status"
          fi

          if [[ "$status" -eq 124 ]]; then
            echo "deno publish timed out after ${timeout_seconds}s; retrying in ${retry_sleep_seconds}s..." >&2
          else
            echo "deno publish failed with exit status ${status}; retrying in ${retry_sleep_seconds}s..." >&2
          fi
          sleep "$retry_sleep_seconds"
        done

  build-docs:
    name: build docs
    runs-on: ubuntu-latest
    needs: artifact-context
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref_type == 'tag'
      )
    steps:
    - uses: actions/checkout@v6
    - uses: actions/cache@v5
      with:
        path: ~/.rustup/toolchains
        key: rustup-v1-${{ runner.os }}-${{ hashFiles('mise.toml') }}
    - uses: jdx/mise-action@v4
      with:
        cache: true
    - name: Build docs
      shell: bash
      env:
        SITE_URL: >-
          ${{ github.ref_type == 'tag'
              && 'https://gukhanmun.org/'
              || 'https://canary.gukhanmun.org/' }}
        PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      run: |
        set -euo pipefail
        mise run docs-build
    - uses: actions/upload-artifact@v7
      with:
        name: docs-site
        path: docs/doc_build
        if-no-files-found: error

  deploy-docs-canary:
    name: deploy docs (canary)
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: docs-site
        path: docs-site
    - uses: nwtgck/actions-netlify@v3
      with:
        publish-dir: docs-site
        production-deploy: 'true'
        deploy-message: Canary docs @ ${{ github.sha }}
        enable-pull-request-comment: 'false'
        enable-commit-comment: 'false'
        github-token: ${{ github.token }}
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-docs-stable:
    name: deploy docs (stable)
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.event_name == 'push' && github.ref_type == 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: docs-site
        path: docs-site
    - uses: actions/upload-pages-artifact@v3
      with:
        path: docs-site
    - uses: actions/deploy-pages@v4
      id: deploy

  release:
    name: github release
    runs-on: ubuntu-latest
    needs:
    - artifact-context
    - publish
    - publish-js
    - publish-python
    - python-dists
    - package-crates
    - build-release-binaries
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - name: Dump debug context
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        git status --short
        git rev-parse HEAD
        ls -lh
    - uses: dahlia/submark@0.4.0
      id: release-notes
      with:
        input-file: CHANGES.md
        heading-level: 2
        heading-title-text: Version ${{ needs.artifact-context.outputs.version }}
        omit-heading: true
    - uses: actions/download-artifact@v8
      with:
        path: release-assets
        pattern: "{crate-packages,npm-packages,binary-*}"
        merge-multiple: true
    - name: Require the original Python artifact identity
      shell: bash
      env:
        ARTIFACT_ID: ${{ needs.python-dists.outputs.artifact-id }}
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ || ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::Missing or invalid original Python artifact ID or manifest digest"
          exit 1
        fi
    - uses: actions/download-artifact@v8
      with:
        artifact-ids: ${{ needs.python-dists.outputs.artifact-id }}
        path: python-dists
    - name: Verify and collect the exact Python release files
      shell: bash
      env:
        MANIFEST_SHA256: ${{ needs.python-dists.outputs.manifest-sha256 }}
      run: |
        set -euo pipefail
        printf '%s  %s\n' "$MANIFEST_SHA256" python-dists/manifest.json | sha256sum --check --strict -
        # This verifier needs only the runner's standard-library Python, not
        # Rust, package installation or the credentialed uploader's tools.
        python3 -I scripts/python/artifacts.py verify --dir python-dists --complete
        files=(python-dists/*.whl python-dists/*.tar.gz)
        test "${#files[@]}" -eq 31
        cp "${files[@]}" release-assets/
        cp python-dists/manifest.json release-assets/python-manifest.json
        cp python-dists/SHA256SUMS release-assets/python-SHA256SUMS
    - name: Dump release assets
      if: runner.debug == '1'
      shell: bash
      run: |
        set -euxo pipefail

        find release-assets -maxdepth 2 -type f -print -exec ls -lh {} \;
    - uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Gukhanmun ${{ needs.artifact-context.outputs.version }}
        body_path: ${{ steps.release-notes.outputs.output-file }}
        files: release-assets/*
